server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version in Server: or on error pages.
    server_tokens off;

    # IMPORTANT — nginx add_header inheritance:
    # a location that declares ANY add_header stops inheriting the ones from
    # this server block. That is why the headers below are repeated inside each
    # location that sets a header of its own. Do not "tidy" the duplication away
    # without checking `curl -I` on both a static asset and a route.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed CRA assets are immutable and safe to cache for a year.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html must NOT be cached. It is the only file whose name never
    # changes, and it names the hashed bundles. A cached copy keeps pointing at
    # bundles that the next deploy has already deleted, which shows up as a
    # blank page for anyone with a warm cache.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Client-side routing: /food/:id, /admin/... etc. are React routes, not
    # files on disk, so anything unmatched falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
